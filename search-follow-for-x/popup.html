<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Search &amp; Follow for X</title>
<style>
  body { width: 360px; font: 13px system-ui, sans-serif; margin: 12px; color: #0f1419; background: #fff; }
  h1 { font-size: 15px; margin: 0 0 10px; }
  label { display: block; margin: 8px 0 3px; font-weight: 600; }
  input[type=text], input[type=number] { width: 100%; box-sizing: border-box; padding: 6px; border: 1px solid #cfd9de; border-radius: 6px; }
  .row { display: flex; gap: 8px; }
  .row > div { flex: 1; }
  .check { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-weight: 400; }
  .btns { display: flex; gap: 8px; margin-top: 12px; }
  button { flex: 1; padding: 8px; border: 0; border-radius: 999px; font-weight: 700; cursor: pointer; }
  #start { background: #0f1419; color: #fff; }
  #stop { background: #eff3f4; color: #0f1419; }
  #status { margin-top: 10px; font-weight: 600; }
  #showTab { display: none; margin-top: 6px; background: none; padding: 0; color: #1d9bf0; font-weight: 600; text-align: left; }

  .results-head { display: flex; justify-content: space-between; align-items: baseline; margin-top: 12px; }
  .results-head h2 { font-size: 13px; margin: 0; }
  .results-head span { color: #536471; font-size: 12px; }
  #results { list-style: none; margin: 6px 0 0; padding: 0; max-height: 260px; overflow-y: auto; border: 1px solid #eff3f4; border-radius: 8px; }
  #results:empty::after { content: "Accounts from the search will appear here, top result first."; display: block; padding: 12px; color: #536471; }
  #results li { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-bottom: 1px solid #eff3f4; cursor: pointer; }
  #results li:last-child { border-bottom: 0; }
  #results li:hover { background: #f7f9f9; }
  .num { color: #8b98a5; width: 18px; text-align: right; font-variant-numeric: tabular-nums; flex: none; }
  .who { flex: 1; min-width: 0; }
  .name { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .handle { color: #536471; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tick { color: #1d9bf0; }
  .badge { flex: none; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: #eff3f4; color: #536471; }
  .badge.followed { background: #e6f7f0; color: #00875a; }
  .badge.next { background: #e8f5fd; color: #1a8cd8; }
  .badge.failed { background: #fdecee; color: #c4232f; }

  details { margin-top: 10px; }
  summary { cursor: pointer; color: #536471; font-weight: 600; }
  #log { margin-top: 6px; max-height: 140px; overflow-y: auto; background: #f7f9f9; border-radius: 6px; padding: 6px; font: 11px ui-monospace, monospace; white-space: pre-wrap; }
</style>
</head>
<body>
  <h1>Search &amp; Follow for X</h1>

  <label for="query">Search text</label>
  <input id="query" type="text" placeholder="e.g. indie hacker AI">

  <div class="row">
    <div>
      <label for="max">Follows this run</label>
      <input id="max" type="number" min="1" max="25" value="10">
    </div>
    <div>
      <label for="daily">Daily cap</label>
      <input id="daily" type="number" min="1" max="100" value="40">
    </div>
  </div>

  <label class="check"><input id="verifiedOnly" type="checkbox"> Verified accounts only</label>
  <label class="check"><input id="skipNoBio" type="checkbox" checked> Skip accounts with no bio</label>

  <div class="btns">
    <button id="start">Start</button>
    <button id="stop">Stop</button>
  </div>

  <div id="status"></div>
  <button id="showTab">Show the X tab →</button>

  <div class="results-head">
    <h2>Results</h2>
    <span id="counts"></span>
  </div>
  <ol id="results"></ol>

  <details>
    <summary>Activity log</summary>
    <div id="log"></div>
  </details>

  <script src="popup.js"></script>
</body>
</html>
