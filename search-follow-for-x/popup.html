<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Search &amp; Follow for X</title>
<style>
  body { width: 320px; font: 13px system-ui, sans-serif; margin: 12px; color: #0f1419; }
  h1 { font-size: 15px; margin: 0 0 10px; }
  label { display: block; margin: 8px 0 3px; font-weight: 600; }
  input[type=text], input[type=number] { width: 100%; box-sizing: border-box; padding: 6px; border: 1px solid #cfd9de; border-radius: 6px; }
  .row { display: flex; gap: 8px; }
  .row > div { flex: 1; }
  .check { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-weight: 400; }
  .btns { display: flex; gap: 8px; margin-top: 12px; }
  button { flex: 1; padding: 8px; border: 0; border-radius: 999px; font-weight: 700; cursor: pointer; }
  #start { background: #0f1419; color: #fff; }
  #stop { background: #eff3f4; color: #0f1419; }
  #status { margin-top: 10px; font-weight: 600; }
  #log { margin-top: 6px; max-height: 180px; overflow-y: auto; background: #f7f9f9; border-radius: 6px; padding: 6px; font: 11px ui-monospace, monospace; white-space: pre-wrap; }
</style>
</head>
<body>
  <h1>Search &amp; Follow for X</h1>

  <label for="query">Search text</label>
  <input id="query" type="text" placeholder="e.g. indie hacker AI">

  <div class="row">
    <div>
      <label for="max">Follows this run</label>
      <input id="max" type="number" min="1" max="25" value="10">
    </div>
    <div>
      <label for="daily">Daily cap</label>
      <input id="daily" type="number" min="1" max="100" value="40">
    </div>
  </div>

  <label class="check"><input id="verifiedOnly" type="checkbox"> Verified accounts only</label>
  <label class="check"><input id="skipNoBio" type="checkbox" checked> Skip accounts with no bio</label>

  <div class="btns">
    <button id="start">Start</button>
    <button id="stop">Stop</button>
  </div>

  <div id="status"></div>
  <div id="log"></div>

  <script src="popup.js"></script>
</body>
</html>
